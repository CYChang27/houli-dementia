<style>

</main>

["activity",/活動|據點|課程|共餐|陪伴|社交|白天無聊/],
["memory",/記憶|失智|忘東忘西|健忘|認知|重複問/]
];
$("custom").addEventListener("submit",e=>{e.preventDefault();const t=$("freeText").value.trim();if(!t)return;rawQuestion=t;
if(/(現在|剛剛|目前).{0,10}(走失|不見|找不到人)|突然.{0,9}(意識不清|昏迷)|已經.{0,6}(吞錯藥|吃錯藥)/.test(t)){selected=/藥/.test(t)?"medication":"safety";emergency();return;}
const found=patterns.filter(([,re])=>re.test(t));if(!found.length){$("question").textContent="目前無法可靠辨識您的問題，請從下方選擇較接近的情況；不會將未知問題直接當成記憶問題。";return}
if(found.length>1){$("custom").hidden=true;$("question").textContent="我發現您的描述可能同時涉及幾種需求。您希望先處理哪一件事？";
options(found.map(([k])=>[categories[k].label,k]),select);return;
}
select(found[0][0])});
$("reset").addEventListener("click",start);start();
})();
</script>
